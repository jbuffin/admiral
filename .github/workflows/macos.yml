name: macOS

# The full check on macOS: build, lint, every unit test and the e2e suites
# (Go e2e with the packaging checks, and the @critical browser flows). It never
# runs on its own: start it from the Actions tab, or the release calls it
# before building.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew install tmux
      - run: npm ci
        working-directory: web
      - run: make build
      - run: make lint
      - run: make test
      - run: npx playwright install webkit
        working-directory: web
      - name: pty diagnostics (start)
        run: |
          sysctl kern.tty.ptmx_max kern.maxfiles kern.maxfilesperproc kern.maxproc kern.maxprocperuid
          ulimit -a
          echo "ptys now: $(ls /dev/ttys* 2>/dev/null | wc -l)"
          lsof -n /dev/ttys* 2>/dev/null | awk 'NR>1{print $1}' | sort | uniq -c | sort -rn | head
          mkdir -p /tmp/ptydiag
          nohup bash -c 'while true; do n=$(ls /dev/ttys* 2>/dev/null | wc -l); echo "$(date +%T) ptys=$n tmux=$(pgrep -x tmux | wc -l) procs=$(ps -A | wc -l)" >> /tmp/ptydiag/samples.log; if [ "$n" -gt 250 ]; then { echo "== $(date +%T) n=$n"; lsof -n /dev/ttys* /dev/ptmx 2>/dev/null | awk "NR>1{print \$1, \$2}" | sort | uniq -c | sort -rn | head -40; ps -Ao pid,ppid,etime,command | grep -E "tmux|fake|admiral|script|expect" | grep -v grep | head -80; } >> /tmp/ptydiag/dumps.log; fi; sleep 3; done' >/dev/null 2>&1 &
      - run: make e2e-critical
      - name: pty diagnostics (end)
        if: always()
        run: |
          echo "ptys now: $(ls /dev/ttys* 2>/dev/null | wc -l)"
          sort -t= -k2 -n /tmp/ptydiag/samples.log | tail -3
          head -150 /tmp/ptydiag/dumps.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptydiag
          path: /tmp/ptydiag/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
