name: macOS

# The full check on macOS: build, lint, every unit test and the e2e suites
# (Go e2e with the packaging checks, and the @critical browser flows). It never
# runs on its own: start it from the Actions tab, or the release calls it
# before building.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew install tmux
      - run: npm ci
        working-directory: web
      - run: make build
      - run: make lint
      - run: echo "make test skipped for the pty diagnostic"
      - name: pty diagnostics (start)
        run: |
          sysctl kern.tty.ptmx_max kern.maxfiles kern.maxfilesperproc kern.maxproc kern.maxprocperuid
          ulimit -a
          echo "ptys now: $(ls /dev/ttys* 2>/dev/null | wc -l)"
          lsof -n /dev/ttys* 2>/dev/null | awk 'NR>1{print $1}' | sort | uniq -c | sort -rn | head
          mkdir -p /tmp/ptydiag
          nohup bash -c 'while true; do echo "$(date +%T.%N | cut -c1-12) ptys=$(ls /dev/ttys* 2>/dev/null | wc -l | tr -d " ") procs=$(ps -A | wc -l | tr -d " ") files=$(sysctl -n kern.num_files) tmux=$(pgrep -x tmux | wc -l | tr -d " ")" >> /tmp/ptydiag/samples.log; sleep 0.2; done' >/dev/null 2>&1 &
          nohup log stream --level debug --predicate 'process == "kernel" OR process == "tmux"' > /tmp/ptydiag/kernel.log 2>&1 &
      - name: who runs EndpointSecurity
        run: |
          systemextensionsctl list || true
          ps -Ao pid,user,command | grep -iE "endpoint|xprotect|syspolicy|falcon|sentinel|santa|osquery|esf|eslogger|mdatp|jamf|security" | grep -v grep || true
          sudo launchctl list | grep -iE "xprotect|endpoint|security|santa|falcon" || true
      - name: go e2e with timings
        run: |
          make build
          for par in 4 1; do
            n=3; [ $par = 1 ] && n=2
            echo "== crew tests only, -parallel $par -count=$n"
            go test -json -count=$n -parallel $par -tags packaging ./e2e/ -run '^TestCrew' > /tmp/ptydiag/crew-p$par.json || true
            grep '"Action":"fail"' /tmp/ptydiag/crew-p$par.json | grep -o '"Test":"[^"]*"' | sort | uniq -c
            grep -c 'Device not configured' /tmp/ptydiag/crew-p$par.json || true
          done
          grep -E '"Action":"fail"' /tmp/ptydiag/e2e.json | head -40
      - name: pty diagnostics (end)
        if: always()
        run: |
          echo "ptys now: $(ls /dev/ttys* 2>/dev/null | wc -l)"
          sort -t= -k2 -n /tmp/ptydiag/samples.log | tail -3
          head -150 /tmp/ptydiag/dumps.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptydiag
          path: /tmp/ptydiag/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
