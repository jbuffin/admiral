name: macOS

# The full check on macOS: build, lint, every unit test and the e2e suites
# (Go e2e and the @critical browser flows). It never runs on its own: start it
# from the Actions tab, or the release calls it before building.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew install tmux
      - run: npm ci
        working-directory: web
      - run: make build
      - run: make lint
      - run: make test
      - run: npx playwright install webkit
        working-directory: web
      - run: make e2e-critical
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
