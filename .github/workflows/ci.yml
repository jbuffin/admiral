name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew install tmux
      - run: npm ci
        working-directory: web
      - run: make build
      - run: make lint
      - run: make test
      - run: npx playwright install webkit
        working-directory: web
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
      # Temporary, for #94: which processes the OS killed or crashed during the run.
      - name: Crash reports and memory kills
        if: always()
        run: |
          memory_pressure | tail -3 || true
          for d in ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports; do
            ls -la "$d" 2>/dev/null || true
            for f in "$d"/*; do [ -f "$f" ] && { echo "== $f"; head -c 1500 "$f"; echo; }; done
          done
          log show --last 25m --style compact --predicate 'eventMessage CONTAINS[c] "jetsam" OR eventMessage CONTAINS[c] "memorystatus" OR eventMessage CONTAINS[c] "IOSurface" OR process == "ReportCrash"' 2>/dev/null | tail -150 || true
