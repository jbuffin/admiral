name: CI

# The light check every PR gets, on Ubuntu: build, lint (code and docs) and the
# unit tests that need neither tmux nor macOS. The e2e suites run on the Mac
# before a push (with evidence in the PR) and in the release; macos.yml runs
# them on demand.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels its run. Each push to main runs on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make check
