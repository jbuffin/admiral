name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew install tmux
      - run: npm ci
        working-directory: web
      - run: make build
      - run: make lint
      - run: make test
      - run: npx playwright install webkit
        working-directory: web
      - run: echo "T0=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
      # Temporary, for #94: GPU events with reduced motion, then the same suite with motion.
      - name: GPU events with reduced motion
        if: always()
        run: |
          log show --start "$T0" --style compact --predicate 'sender == "AppleParavirtGPU" OR eventMessage CONTAINS[c] "gpu reset" OR eventMessage CONTAINS[c] "gpurestart" OR eventMessage CONTAINS[c] "context lost"' > gpu.log 2>/dev/null || true
          echo "GPU events: $(tail -n +2 gpu.log | wc -l)"
          tail -n +2 gpu.log | cut -c 25- | sed -E 's/0x[0-9a-f]+/X/g; s/[0-9]+/N/g' | cut -c1-140 | sort | uniq -c | sort -rn | head -15
      - run: echo "T1=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
        if: always()
      - name: e2e again with motion
        if: always()
        continue-on-error: true
        run: npx playwright test
        working-directory: web
        env:
          E2E_MOTION: '1'
      - name: GPU events with motion
        if: always()
        run: |
          log show --start "$T1" --style compact --predicate 'sender == "AppleParavirtGPU" OR eventMessage CONTAINS[c] "gpu reset" OR eventMessage CONTAINS[c] "gpurestart" OR eventMessage CONTAINS[c] "context lost"' > gpu.log 2>/dev/null || true
          echo "GPU events: $(tail -n +2 gpu.log | wc -l)"
          tail -n +2 gpu.log | cut -c 25- | sed -E 's/0x[0-9a-f]+/X/g; s/[0-9]+/N/g' | cut -c1-140 | sort | uniq -c | sort -rn | head -15
