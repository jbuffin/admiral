<!doctype html>
<!--
  PROTOTYPE, throwaway. Wayfinder ticket "Prototype: the visual system" (#233).
  Question: what visual system does the redesign use? Tokens for light and dark,
  status glyphs, ship and bot icons, and the harness flags.
  Three variants on one page, switchable with ?variant=A|B|C, the bottom bar, or ← →.
  Each variant renders the same Ships screen (sidebar, status-grouped list, bridge
  with a needs-you question) and a specimen sheet. Theme: system, or ?theme=light|dark.
  Harness flags are lettered placeholders on the vendors' field colors; never the real logos.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual system prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--fs-body);line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:96px}
button{font:inherit;color:inherit}
.proto-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.proto-top b{font-weight:600}
.proto-top .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;min-height:32px;cursor:pointer;color:var(--text2)}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--text);font-weight:600}
.wrap{max-width:1360px;margin:0 auto;padding:20px 16px}
.lead{color:var(--text2);max-width:880px;margin:0 0 16px}
h2.sec{font-family:var(--font-display);font-size:var(--fs-h2);font-weight:var(--w-display);margin:28px 0 10px;letter-spacing:var(--track-display)}

/* the app screen */
.app{display:grid;grid-template-columns:220px minmax(280px,380px) 1fr;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--bg);min-height:560px;box-shadow:0 1px 2px var(--shadow)}
.side{background:var(--side);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;font-family:var(--font-display);font-weight:var(--w-display);font-size:15px}
.fleetsw{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:0 0 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);min-height:36px;width:100%;text-align:left;cursor:pointer}
.fdot{width:10px;height:10px;border-radius:3px;flex:none}
.nav{display:flex;align-items:center;gap:9px;padding:0 8px;min-height:32px;border:0;background:none;border-radius:var(--r-sm);text-align:left;color:var(--text2);cursor:pointer;width:100%}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);color:var(--text);font-weight:500}
.nav .ct{margin-left:auto;font-size:12px;color:var(--muted)}
.nav .ct.hot{color:var(--needs);font-weight:600}
.list{border-right:1px solid var(--line);background:var(--panel);overflow:auto}
.listhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
.grp{padding:12px 14px 4px;font-size:12px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:var(--row-h);border:0;background:none;width:100%;text-align:left;cursor:pointer}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.row .nm{font-weight:500;white-space:nowrap}
.row .meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row .end{display:flex;gap:6px;align-items:center;flex:none}
.bridge{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.bhead{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.bhead .t{font-family:var(--font-display);font-weight:var(--w-display);font-size:16px}
.bhead .sub{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:none;padding:0 10px;min-height:30px;border-radius:var(--r-sm);color:var(--muted);cursor:pointer}
.tab.on{background:var(--sel);color:var(--text);font-weight:500}
.convo{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1;overflow:auto}
.msg{display:flex;gap:10px;max-width:640px}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:2px}
.msg .body{color:var(--text)}
.tool{font-family:var(--font-mono);font-size:12px;color:var(--text2);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;display:flex;gap:8px;align-items:center}
.tool .ok{color:var(--ok)}
.qcard{border:1px solid var(--needs-line);background:var(--needs-bg);border-radius:var(--r-md);padding:12px 14px;max-width:640px}
.qcard .q{font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r-sm);padding:0 12px;min-height:36px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.compose{margin:0 16px 16px;border:1px solid var(--line2);border-radius:var(--r-md);background:var(--panel);display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px}
.compose input{flex:1;border:0;background:none;color:var(--text);font:inherit;min-height:32px;outline:none}
.compose input::placeholder{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;min-height:22px;background:var(--panel)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}

/* specimen */
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-lg);padding:14px 16px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--text2)}
.sw{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;font-size:12px}
.sw i{display:block;width:28px;height:20px;border-radius:5px;border:1px solid var(--line)}
.sw code{font-family:var(--font-mono);color:var(--muted);font-size:11px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair>div{border-radius:var(--r-md);padding:10px;border:1px solid var(--line)}
.ic{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end}
.ic figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);min-width:56px;text-align:center}
.type-s>div{display:flex;align-items:baseline;gap:12px;padding:3px 0}
.type-s code{font-family:var(--font-mono);font-size:11px;color:var(--muted);width:120px;flex:none}

/* phone */
.phone{width:375px;max-width:100%;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:var(--bg)}
.phone .bar{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--panel);padding:6px 0 10px}
.phone .bar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-height:44px;min-width:56px;justify-content:center}
.phone .bar button.on{color:var(--text)}

/* switcher: deliberately not part of any variant */
.switch{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#111;color:#fff;border-radius:999px;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:10;font-family:system-ui,sans-serif;font-size:13px}
.switch button{background:none;border:0;color:#fff;width:40px;height:40px;border-radius:999px;cursor:pointer;font-size:18px}
.switch button:hover{background:rgba(255,255,255,.12)}
.switch span{padding:0 10px;white-space:nowrap}

.cosy .side{padding:8px 6px}
.cosy .nav{min-height:28px;gap:8px}
.cosy .brand{padding:4px 8px 8px;font-size:14px}
.cosy .fleetsw{min-height:30px;margin-bottom:6px}
.cosy .listhead{padding:9px 12px}
.cosy .grp{padding:9px 12px 3px}
.cosy .row{padding:0 12px;gap:8px}
.cosy .bhead{padding:8px 14px}
.cosy .tab{min-height:26px}
.cosy .convo{padding:12px 14px;gap:10px}
.cosy .qcard{padding:10px 12px}
.cosy .btn{min-height:30px;padding:0 10px}
.cosy .compose{margin:0 14px 14px}
.cosy .compose input{min-height:28px}
@media (pointer:coarse){.cosy .row{min-height:44px}.cosy .nav,.cosy .btn,.cosy .tab,.cosy .fleetsw{min-height:44px}}
@media (max-width:980px){.app{grid-template-columns:1fr}.side{display:none}.list{border-right:0;border-bottom:1px solid var(--line);max-height:360px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 2.4s linear infinite;transform-origin:50% 50%}
</style>
</head>
<body>
<div class="proto-top">
  <b>Prototype · visual system</b><span style="color:var(--muted)">#233 · throwaway</span>
  <span class="grow"></span>
  <div class="seg" role="group" aria-label="Theme">
    <button data-theme="system">System</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button>
  </div>
</div>
<main class="wrap" id="root"></main>
<div class="switch" role="group" aria-label="Variant switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <span id="label"></span>
  <button id="next" aria-label="Next variant">→</button>
</div>

<script>
/* ---------- data (sample) ---------- */
const FLEETS = { work: 'Work', home: 'Home' };
const SHIPS = [
  { name: 'Brass Kettle', status: 'needs', fleet: 'work', harness: 'claude', what: 'MOB-1183 · on-device check', age: '12m', crew: 2, subs: 1 },
  { name: 'Saltpaw', status: 'needs', fleet: 'work', harness: 'copilot', what: 'checker needs you', age: '31m', crew: 3, subs: 0, crewNeeds: true },
  { name: 'Little Bramble', status: 'run', fleet: 'work', harness: 'claude', what: 'admiral#199 · writing tests', age: '4m', crew: 1, subs: 3 },
  { name: 'Quiet Lantern', status: 'run', fleet: 'home', harness: 'codex', what: 'skills#193 · reading', age: '9m', crew: 0, subs: 0 },
  { name: 'Copper Wren', status: 'ready', fleet: 'work', harness: 'claude', what: 'PR #212 · approved, checks green', age: '2h', crew: 0, subs: 0 },
  { name: 'Gull Ferry', status: 'moored', fleet: 'home', harness: 'copilot', what: 'PR #88 · waiting on review', age: '1d', crew: 0, subs: 0 },
  { name: 'Iron Sorrel', status: 'anchored', fleet: 'work', harness: 'codex', what: 'exit 1 · tests failed', age: '40m', crew: 0, subs: 0 },
];
const GROUPS = [
  ['needs', 'Needs you'], ['run', 'Running'], ['ready', 'Ready to merge'], ['moored', 'Moored'], ['anchored', 'Anchored'],
];
const HARNESS = {
  claude: { label: 'Claude Code', ph: 'Cl', field: '#FAF9F5', ink: '#D97757' },
  copilot: { label: 'Copilot CLI', ph: 'Co', field: '#1B1F24', ink: '#FFFFFF' },
  codex: { label: 'Codex CLI', ph: 'Cx', field: '#FFFFFF', ink: '#0D0D0D' },
};

/* ---------- variants ---------- */
const V = {
A: {
  name: 'Slate (as wireframed)',
  blurb: 'The tokens already drawn in the direction D wireframes: cool grey neutrals, one teal accent, coral only for Needs you. Inter throughout. Status is a ring glyph. Ships are a line hull and sail with the hull filled in the fleet color. Bots are square faces. Harness flags are small rounded tiles on the vendor field.',
  font: { body: "Inter, system-ui, sans-serif", display: "Inter, system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace", wDisplay: 600, track: '-0.01em' },
  size: { body: '13.5px', h2: '18px', rowH: '40px' },
  radius: { sm: 6, md: 8, lg: 10 },
  light: { bg:'#F4F5F7', side:'#F4F5F7', panel:'#FFFFFF', hover:'rgba(15,25,40,.045)', sel:'rgba(15,25,40,.07)', line:'#E5E7EB', line2:'#D6DAE0', text:'#18212C', text2:'#3C4856', muted:'#6B7684', accent:'#0F8C9B', onAccent:'#FFFFFF', needs:'#E5532F', run:'#0F8C9B', rev:'#5662D6', ok:'#2E9E5B', err:'#D93A36', shadow:'rgba(16,24,40,.08)', term:'#0E1620' },
  dark: { bg:'#0B1118', side:'#0B1118', panel:'#111922', hover:'rgba(255,255,255,.04)', sel:'rgba(255,255,255,.07)', line:'rgba(255,255,255,.07)', line2:'rgba(255,255,255,.12)', text:'#E4E9EF', text2:'#B6C0CB', muted:'#7F8B98', accent:'#2BB5C5', onAccent:'#04191D', needs:'#FF7A59', run:'#2BB5C5', rev:'#8B9CFF', ok:'#5FD08A', err:'#F25F5C', shadow:'rgba(0,0,0,.45)', term:'#070C12' },
  fleet: { work: { light:'#3B6FE0', dark:'#5B8CFF' }, home: { light:'#D9960F', dark:'#FFC23D' } },
  crew: ['#7FC8FF','#FFC23D','#9BE08A','#FF9A7A','#C9B6FF'],
  status(s, sz=14) {
    const c = { needs:'var(--needs)', run:'var(--run)', ready:'var(--ok)', moored:'var(--rev)', anchored:'var(--err)' }[s];
    const g = {
      needs: `<circle cx="8" cy="8" r="6.5" fill="${c}"/><path d="M8 4.8v3.8M8 11h0" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>`,
      run: `<circle cx="8" cy="8" r="6.5" fill="none" stroke="${c}" stroke-width="1.6"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="${c}"/>`,
      ready: `<circle cx="8" cy="8" r="6.5" fill="${c}"/><path d="M5.2 8.2 7.2 10.2 10.9 6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
      moored: `<circle cx="8" cy="8" r="6.5" fill="none" stroke="${c}" stroke-width="1.6"/><path d="M8 5v3.2l2 1.4" stroke="${c}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`,
      anchored: `<circle cx="8" cy="8" r="6.5" fill="none" stroke="${c}" stroke-width="1.6"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/>`,
    }[s];
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 16 16" aria-hidden="true">${g}</svg>`;
  },
  ship(fleet, sz=18, state) {
    const f = fleet || 'var(--muted)';
    const dim = state === 'anchored' ? ' opacity=".55"' : '';
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${dim}><path d="M3 15h18l-2.4 4.2a2 2 0 0 1-1.7 1H7.1a2 2 0 0 1-1.7-1z" fill="${f}" stroke="${f}"/><path d="M11 3v12"/>${state==='moored'?'<path d="M11 6h6"/>':'<path d="M11 4.5 17.5 12H11z"/>'}</svg>`;
  },
  bot(kind, color, sz=18) {
    if (kind === 'admiral') return markColor(sz);
    if (kind === 'sub') return `<svg width="${sz*0.7}" height="${sz*0.7}" viewBox="0 0 8.5 8.5" aria-hidden="true"><rect x="0.8" y="0.8" width="6.9" height="6.9" rx="1.4" fill="none" stroke="var(--muted)" stroke-width="0.9"/><rect x="2.4" y="3.1" width="1.2" height="1.2" fill="var(--muted)"/><rect x="4.9" y="3.1" width="1.2" height="1.2" fill="var(--muted)"/></svg>`;
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 8.5 8.5" aria-hidden="true"><rect x="0.8" y="0.8" width="6.9" height="6.9" rx="1.3" fill="${color}"/><rect x="2.4" y="3.1" width="1.2" height="1.2" fill="#14304A"/><rect x="4.9" y="3.1" width="1.2" height="1.2" fill="#14304A"/></svg>`;
  },
  flag(h, sz=18) {
    const x = HARNESS[h];
    return `<span title="${x.label}" style="display:inline-grid;place-items:center;width:${sz}px;height:${sz}px;border-radius:5px;background:${x.field};color:${x.ink};font:600 ${sz*0.42}px/1 Inter,sans-serif;box-shadow:inset 0 0 0 1px var(--line2)">${x.ph}</span>`;
  },
  statusLabel: false,
},

B: {
  name: 'Graphite, one signal',
  blurb: 'Closest to Linear. Pure neutral greys, no brand accent in the chrome: the only color on screen is Needs you (coral), the fleet dot and the crew. Status is shape, not hue: a dashed ring, a pie that fills, a check, a pause, a slash. Denser rows and smaller radii. Ships drop to a small geometric hull; the harness flag is a round badge that leads the row.',
  font: { body: "Inter, system-ui, sans-serif", display: "Inter, system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace", wDisplay: 600, track: '-0.015em' },
  size: { body: '13px', h2: '17px', rowH: '34px' },
  radius: { sm: 5, md: 6, lg: 8 },
  light: { bg:'#FCFCFD', side:'#F7F7F8', panel:'#FFFFFF', hover:'rgba(0,0,0,.035)', sel:'rgba(0,0,0,.06)', line:'#EBEBED', line2:'#DCDCE0', text:'#1A1A1E', text2:'#3F3F46', muted:'#6E6E78', accent:'#1A1A1E', onAccent:'#FFFFFF', needs:'#E5532F', run:'#3F3F46', rev:'#6E6E78', ok:'#3F3F46', err:'#6E6E78', shadow:'rgba(0,0,0,.05)', term:'#111113' },
  dark: { bg:'#0F0F11', side:'#141416', panel:'#161618', hover:'rgba(255,255,255,.04)', sel:'rgba(255,255,255,.07)', line:'rgba(255,255,255,.07)', line2:'rgba(255,255,255,.12)', text:'#EDEDEF', text2:'#C4C4CA', muted:'#8B8B94', accent:'#EDEDEF', onAccent:'#0F0F11', needs:'#FF7A59', run:'#C4C4CA', rev:'#8B8B94', ok:'#C4C4CA', err:'#8B8B94', shadow:'rgba(0,0,0,.5)', term:'#0A0A0B' },
  fleet: { work: { light:'#4C6FFF', dark:'#7B93FF' }, home: { light:'#E0A100', dark:'#F2C14E' } },
  crew: ['#8FB6FF','#F2C14E','#8FD18A','#FF9F85','#C7B5FF'],
  status(s, sz=14) {
    const c = s==='needs' ? 'var(--needs)' : 'var(--text2)';
    const g = {
      needs: `<circle cx="8" cy="8" r="6.5" fill="${c}"/><path d="M8 4.8v3.8M8 11h0" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>`,
      run: `<circle cx="8" cy="8" r="6" fill="none" stroke="${c}" stroke-width="1.5"/><path d="M8 4v4h4a4 4 0 0 0-4-4z" fill="${c}" class="spin" style="transform-box:fill-box;transform-origin:0 100%"/>`,
      ready: `<circle cx="8" cy="8" r="6.5" fill="${c}"/><path d="M5.2 8.2 7.2 10.2 10.9 6" stroke="var(--panel)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
      moored: `<circle cx="8" cy="8" r="6" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="2.4 2"/><path d="M6.6 5.8v4.4M9.4 5.8v4.4" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/>`,
      anchored: `<circle cx="8" cy="8" r="6" fill="none" stroke="${c}" stroke-width="1.5"/><path d="M4.5 11.5l7-7" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/>`,
    }[s];
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 16 16" aria-hidden="true">${g}</svg>`;
  },
  ship(fleet, sz=16, state) {
    const dim = state === 'anchored' ? ' opacity=".5"' : '';
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 16 16" aria-hidden="true"${dim}><path d="M2 9.5h12l-1.8 3.5H3.8z" fill="var(--text2)"/><path d="M8 2.5v6.2H4.2z" fill="${fleet||'var(--muted)'}"/></svg>`;
  },
  bot(kind, color, sz=18) {
    if (kind === 'admiral') return markMono(sz);
    if (kind === 'sub') return `<svg width="${sz*0.6}" height="${sz*0.6}" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="2.4" fill="var(--muted)"/><circle cx="3.7" cy="4.6" r=".9" fill="var(--panel)"/><circle cx="6.3" cy="4.6" r=".9" fill="var(--panel)"/></svg>`;
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="2.4" fill="${color}"/><circle cx="3.7" cy="4.6" r=".9" fill="#1A1A1E"/><circle cx="6.3" cy="4.6" r=".9" fill="#1A1A1E"/></svg>`;
  },
  flag(h, sz=18) {
    const x = HARNESS[h];
    return `<span title="${x.label}" style="display:inline-grid;place-items:center;width:${sz}px;height:${sz}px;border-radius:999px;background:${x.field};color:${x.ink};font:600 ${sz*0.4}px/1 Inter,sans-serif;box-shadow:inset 0 0 0 1px var(--line2)">${x.ph}</span>`;
  },
  rowIcon: 'flag',
  statusLabel: false,
},

C: {
  name: 'Ink and brass, brand-carried',
  blurb: 'Carries the old Admiral palette into the clean layout: navy ink for text and dark mode, a teal accent, brass (the mark\'s gold) kept for AdmiralBot alone. Bricolage Grotesque for headings, Archivo for body, as before. Status is a labelled pill, so the words do the work. Ships keep a simplified two-sail silhouette with a fleet stripe; AdmiralBot keeps the bicorne; flags stay swallowtail pennants.',
  font: { body: "Archivo, system-ui, sans-serif", display: "'Bricolage Grotesque', system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace", wDisplay: 700, track: '-0.01em' },
  size: { body: '14px', h2: '20px', rowH: '44px' },
  radius: { sm: 8, md: 10, lg: 14 },
  light: { bg:'#F6F7F9', side:'#EEF2F6', panel:'#FFFFFF', hover:'rgba(20,48,74,.05)', sel:'rgba(20,48,74,.08)', line:'#E1E6EC', line2:'#CCD5DF', text:'#14304A', text2:'#3E5870', muted:'#627789', accent:'#0E7C89', onAccent:'#FFFFFF', needs:'#C2412A', run:'#0E7C89', rev:'#4F5BC4', ok:'#2C8A4E', err:'#B0362A', shadow:'rgba(20,48,74,.08)', term:'#0E2235', brass:'#B98A12' },
  dark: { bg:'#0A1826', side:'#0D1D2E', panel:'#102335', hover:'rgba(191,215,234,.05)', sel:'rgba(191,215,234,.09)', line:'rgba(191,215,234,.10)', line2:'rgba(191,215,234,.16)', text:'#EAF1F7', text2:'#BFD7EA', muted:'#8BA3B8', accent:'#4CC3CF', onAccent:'#06222A', needs:'#FF8A6A', run:'#4CC3CF', rev:'#9BA6FF', ok:'#7FD39A', err:'#FF8A7A', shadow:'rgba(0,0,0,.45)', term:'#071421', brass:'#FFC23D' },
  fleet: { work: { light:'#3366E0', dark:'#6E93F0' }, home: { light:'#D97A16', dark:'#F2A04A' } },
  crew: ['#7FC8FF','#FFC23D','#9BE08A','#FF9A7A','#C9B6FF'],
  status(s, sz=14) {
    const c = { needs:'var(--needs)', run:'var(--run)', ready:'var(--ok)', moored:'var(--rev)', anchored:'var(--err)' }[s];
    return `<svg width="${sz*0.6}" height="${sz*0.6}" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3.5" fill="${c}"/></svg>`;
  },
  ship(fleet, sz=20, state) {
    const f = fleet || 'var(--muted)';
    const dim = state === 'anchored' ? ' opacity=".5"' : '';
    const sails = state==='moored' ? '<path d="M12 4v10" stroke="var(--text2)" stroke-width="1.4"/><path d="M9 7h6" stroke="var(--text2)" stroke-width="1.4" stroke-linecap="round"/>' : '<path d="M12 3v11" stroke="var(--text2)" stroke-width="1.4"/><path d="M12.8 4.2 18.5 13H12.8z" fill="var(--text2)"/><path d="M11.2 6 7 13h4.2z" fill="var(--text2)" opacity=".65"/>';
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" aria-hidden="true"${dim}>${sails}<path d="M3.5 15h17l-2.6 4.6a1.6 1.6 0 0 1-1.4.8H7.5a1.6 1.6 0 0 1-1.4-.8z" fill="var(--text)"/><path d="M5 16.6h14" stroke="${f}" stroke-width="1.8"/></svg>`;
  },
  bot(kind, color, sz=18) {
    if (kind === 'admiral') return markColor(sz);
    if (kind === 'sub') return `<svg width="${sz*0.65}" height="${sz*0.65}" viewBox="0 0 8.5 8.5" aria-hidden="true"><rect x="0.8" y="0.8" width="6.9" height="6.9" rx="1.4" fill="var(--muted)"/><rect x="2.4" y="3.1" width="1.2" height="1.2" fill="var(--panel)"/><rect x="4.9" y="3.1" width="1.2" height="1.2" fill="var(--panel)"/></svg>`;
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 8.5 8.5" aria-hidden="true"><rect x="0.8" y="0.8" width="6.9" height="6.9" rx="1.3" fill="${color}" stroke="var(--text)" stroke-width=".55"/><rect x="2.4" y="3.1" width="1.2" height="1.2" fill="#14304A"/><rect x="4.9" y="3.1" width="1.2" height="1.2" fill="#14304A"/><rect x="3" y="5.4" width="2.5" height=".7" fill="#14304A"/></svg>`;
  },
  flag(h, sz=18) {
    const x = HARNESS[h]; const w = sz*1.4, hh = sz;
    return `<svg width="${w}" height="${hh}" viewBox="0 0 40 28" role="img" aria-label="${x.label}"><path d="M1 1h38l-8 13 8 13H1z" fill="${x.field}" stroke="var(--line2)" stroke-width="1.5" stroke-linejoin="round"/><text x="14" y="18.5" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="700" font-size="12" fill="${x.ink}">${x.ph}</text></svg>`;
  },
  statusLabel: true,
},
};
/* A2: A's colors, glyphs and icons at B's density. On touch, rows stay 44px (see the @media rule). */
V.A2 = Object.assign({}, V.A, {
  name: 'Slate, cosier',
  blurb: 'A as wireframed, at B\'s density: 13px body, 34px rows, 5/6/8 radii, a tighter sidebar and bridge. Colors, status rings, ships, bots and flags are A\'s, unchanged. On a touch screen rows grow back to 44px so they stay tappable.',
  size: { body: '13px', h2: '17px', rowH: '34px' },
  radius: { sm: 5, md: 6, lg: 8 },
  cosy: true,
});
const KEYS = ['A', 'A2', 'B']; /* C ruled out */

/* the Admiral mark, kept as is (color) and as a one-color glyph */
function markColor(sz){return `<svg width="${sz}" height="${sz}" viewBox="0 0 46 46" fill="none" aria-hidden="true"><path d="M5 20 Q23 0 41 20 Z" fill="#0B1F33" stroke="#FFC23D" stroke-width="2.5" stroke-linejoin="round"/><circle cx="23" cy="12" r="3" fill="#FFC23D"/><rect x="9" y="20" width="28" height="22" rx="4" fill="#FFC23D" stroke="#0B1F33" stroke-width="2.5"/><rect x="15" y="27" width="5" height="5" fill="#14304A"/><rect x="26" y="27" width="5" height="5" fill="#14304A"/><rect x="18" y="36" width="10" height="3" fill="#14304A"/></svg>`}
function markMono(sz){return `<svg width="${sz}" height="${sz}" viewBox="0 0 46 46" fill="none" aria-hidden="true"><path d="M5 20 Q23 0 41 20 Z" fill="var(--text)"/><rect x="9" y="20" width="28" height="22" rx="5" fill="none" stroke="var(--text)" stroke-width="3"/><rect x="16" y="27" width="4.5" height="4.5" rx="1" fill="var(--text)"/><rect x="25.5" y="27" width="4.5" height="4.5" rx="1" fill="var(--text)"/></svg>`}

/* ---------- state ---------- */
const qs = new URLSearchParams(location.search);
let cur = KEYS.includes(qs.get('variant')) ? qs.get('variant') : 'A';
let theme = ['light','dark'].includes(qs.get('theme')) ? qs.get('theme') : 'system';
let sel = 'Brass Kettle';
let tab = 'Conversation';
const mq = matchMedia('(prefers-color-scheme: dark)');

function mode(){ return theme === 'system' ? (mq.matches ? 'dark' : 'light') : theme; }
function setURL(){ const p = new URLSearchParams(location.search); p.set('variant', cur); theme==='system'?p.delete('theme'):p.set('theme',theme); history.replaceState(null,'','?'+p); }

function applyTokens(v, m){
  const t = v[m], r = document.documentElement.style;
  const map = { bg:'--bg', side:'--side', panel:'--panel', hover:'--hover', sel:'--sel', line:'--line', line2:'--line2', text:'--text', text2:'--text2', muted:'--muted', accent:'--accent', onAccent:'--on-accent', needs:'--needs', run:'--run', rev:'--rev', ok:'--ok', err:'--err', shadow:'--shadow', term:'--term', brass:'--brass' };
  for (const k in map) r.setProperty(map[k], t[k] || '');
  r.setProperty('--needs-bg', `color-mix(in srgb, ${t.needs} ${m==='dark'?10:7}%, transparent)`);
  r.setProperty('--needs-line', `color-mix(in srgb, ${t.needs} ${m==='dark'?35:30}%, transparent)`);
  r.setProperty('--font-body', v.font.body); r.setProperty('--font-display', v.font.display); r.setProperty('--font-mono', v.font.mono);
  r.setProperty('--w-display', v.font.wDisplay); r.setProperty('--track-display', v.font.track);
  r.setProperty('--fs-body', v.size.body); r.setProperty('--fs-h2', v.size.h2); r.setProperty('--row-h', v.size.rowH);
  r.setProperty('--r-sm', v.radius.sm+'px'); r.setProperty('--r-md', v.radius.md+'px'); r.setProperty('--r-lg', v.radius.lg+'px');
  document.documentElement.style.colorScheme = m;
  document.documentElement.classList.toggle('cosy', !!v.cosy);
}

/* ---------- render ---------- */
function pill(v, s){
  const lbl = Object.fromEntries(GROUPS)[s];
  const c = { needs:'--needs', run:'--run', ready:'--ok', moored:'--rev', anchored:'--err' }[s];
  return `<span class="pill" style="color:var(${c});background:color-mix(in srgb,var(${c}) 12%,transparent)">${v.status(s,12)}${lbl}</span>`;
}
function fleetColor(v, f, m){ return v.fleet[f][m]; }

function render(){
  const v = V[cur], m = mode();
  applyTokens(v, m);
  document.querySelectorAll('[data-theme]').forEach(b => b.setAttribute('aria-pressed', b.dataset.theme === theme));
  document.getElementById('label').textContent = `${cur} (${v.name})`;
  const ship = SHIPS.find(s => s.name === sel);

  const side = `
    <aside class="side">
      <div class="brand">${v.bot('admiral',null,22)}Admiral</div>
      <button class="fleetsw"><span class="fdot" style="background:${fleetColor(v,'work',m)}"></span>Work<span style="margin-left:auto;color:var(--muted)">⌄</span></button>
      <button class="nav">${ic('inbox')}Inbox<span class="ct hot">5</span></button>
      <button class="nav">${v.bot('admiral',null,15)}AdmiralBot</button>
      <button class="nav on">${v.ship(null,15)}Ships<span class="ct">7</span></button>
      <button class="nav">${ic('list')}Orders<span class="ct">23</span></button>
      <button class="nav">${ic('tree')}Campaigns<span class="ct">2</span></button>
      <button class="nav">${ic('clock')}Routines<span class="ct">4</span></button>
      <button class="nav">${ic('shield')}Standing orders</button>
      <button class="nav">${ic('people')}Crew</button>
      <span style="flex:1"></span>
      <button class="nav">${ic('gear')}Preferences</button>
    </aside>`;

  const rows = GROUPS.map(([k, lbl]) => {
    const ss = SHIPS.filter(s => s.status === k); if (!ss.length) return '';
    return `<div class="grp">${v.statusLabel ? '' : v.status(k,12)}${lbl}<span>${ss.length}</span></div>` + ss.map(s => {
      const lead = v.rowIcon === 'flag' ? v.flag(s.harness,18) : v.statusLabel ? '' : v.status(s.status);
      const crewDots = s.crew ? `<span class="chip" title="${s.crew} crew">${Array.from({length:Math.min(s.crew,3)},(_,i)=>v.bot('crew',v.crew[i],11)).join('')}${s.crewNeeds?`<span style="color:var(--needs);font-weight:700">!</span>`:''}</span>` : '';
      return `<button class="row ${s.name===sel?'on':''}" data-ship="${s.name}">
        ${lead}${v.rowIcon==='flag'?'':v.ship(fleetColor(v,s.fleet,m),16,s.status)}
        <span style="display:flex;flex-direction:column;min-width:0;flex:1"><span class="nm">${s.name}</span><span class="meta">${s.what}</span></span>
        <span class="end">${crewDots}${v.statusLabel?pill(v,s.status):''}${v.rowIcon==='flag'?`<span class="fdot" style="background:${fleetColor(v,s.fleet,m)}" title="${FLEETS[s.fleet]}"></span>`:v.flag(s.harness,16)}<span class="meta" style="flex:none">${s.age}</span></span>
      </button>`;
    }).join('');
  }).join('');

  const list = `<section class="list" aria-label="Ships"><div class="listhead">${v.ship(null,16)}Ships<span style="color:var(--muted);font-weight:400">· Work and Home</span></div>${rows}</section>`;

  const bridge = `
    <section class="bridge" aria-label="Bridge">
      <div class="bhead">
        ${v.ship(fleetColor(v,ship.fleet,m),22,ship.status)}
        <div><div class="t">${ship.name}</div><div class="sub">${HARNESS[ship.harness].label} · ${FLEETS[ship.fleet]} · commodore</div></div>
        ${v.flag(ship.harness,20)}
        ${v.statusLabel?pill(v,ship.status):v.status(ship.status,16)}
        <div class="tabs">${['Conversation','Terminal','Crew'].map(t=>`<button class="tab ${t===tab?'on':''}" data-tab="${t}">${t}</button>`).join('')}</div>
      </div>
      ${tab==='Terminal' ? `<div style="flex:1;background:var(--term);color:#D7E0EA;font:12.5px/1.6 var(--font-mono);padding:14px 16px">$ claude --skill commodore<br><span style="color:#7FA6C4">● Reading ios/Checks/DeviceCheck.swift</span><br><span style="color:#6FE3C8">✓ 3 tests pass</span><br><span style="color:${V[cur][m].needs}">? Which device should the on-device check use?</span></div>` : tab==='Crew' ? `<div class="convo">${['Vega · Test writer','Tinker · Reviewer'].map((c,i)=>`<div style="display:flex;gap:10px;align-items:center">${v.bot('crew',v.crew[i],22)}<span>${c}</span><span style="margin-left:auto">${v.status(i?'run':'needs')}</span></div>`).join('')}<div style="display:flex;gap:10px;align-items:center;color:var(--muted)">${v.bot('sub',null,22)}Subagent · Explore · no terminal</div></div>` : `
      <div class="convo">
        <div class="msg"><div>${v.bot('crew',v.crew[0],22)}</div><div><div class="who">Vega · Test writer</div><div class="body">The DeviceCheck tests pass on the simulator. Before I run the on-device check I need a device.</div></div></div>
        <div class="tool"><span class="ok">✓</span>Ran <b>make test-ios</b> · 3 passed · 41s</div>
        <div class="qcard"><div class="q">${v.status('needs',16)}Which device should the on-device check use?</div>
          <div class="opts"><button class="btn">iPhone 16 (USB)</button><button class="btn">iPad Air (Wi-Fi)</button><button class="btn">Skip on-device</button><button class="btn">Other…</button></div></div>
        <div class="msg"><div>${v.bot('sub',null,22)}</div><div><div class="who">Subagent · Explore</div><div class="body" style="color:var(--text2)">Found 2 paired devices in Xcode.</div></div></div>
      </div>`}
      <div class="compose"><input placeholder="Message ${ship.name}…" aria-label="Message"><button class="btn primary">Send</button></div>
    </section>`;

  const app = `<div class="app">${side}${list}${bridge}</div>`;

  /* specimen */
  const tokRows = ['bg','panel','line','text','text2','muted','accent','needs','run','rev','ok','err'];
  const swatches = (mm) => `<div class="sw">${tokRows.map(k=>`<i style="background:${v[mm][k]}"></i><span>${k}</span><code>${v[mm][k]}</code>`).join('')}</div>`;
  const statusCard = GROUPS.map(([k,l])=>`<figure>${v.statusLabel?pill(v,k):v.status(k,20)}<span>${l}</span></figure>`).join('');
  const shipCard = ['run','needs','moored','anchored'].map(s=>`<figure>${v.ship(fleetColor(v,'work',m),32,s)}<span>${{run:'Running',needs:'Needs you',moored:'Moored',anchored:'Anchored'}[s]}</span></figure>`).join('')
    + `<figure>${v.ship(fleetColor(v,'home',m),32,'run')}<span>Home fleet</span></figure>`;
  const botCard = `<figure>${v.bot('admiral',null,34)}<span>AdmiralBot</span></figure>` + v.crew.slice(0,3).map((c,i)=>`<figure>${v.bot('crew',c,30)}<span>${['Vega','Tinker','Halyard'][i]}</span></figure>`).join('') + `<figure>${v.bot('sub',null,30)}<span>Subagent</span></figure>`;
  const flagCard = Object.keys(HARNESS).map(h=>`<figure>${v.flag(h,26)}<span>${HARNESS[h].label}</span></figure>`).join('') + `<figure>${v.flag('claude',16)}${v.flag('copilot',16)}${v.flag('codex',16)}<span>at row size</span></figure>`;
  const fleetCard = Object.keys(FLEETS).map(f=>`<figure><span class="fdot" style="width:22px;height:22px;border-radius:6px;background:${fleetColor(v,f,m)}"></span><span>${FLEETS[f]}<br><code style="font-size:10px">${v.fleet[f].light} / ${v.fleet[f].dark}</code></span></figure>`).join('');

  const spec = `
    <div class="spec">
      <div class="card"><h3>Colors · light and dark</h3><div class="pair"><div style="background:${v.light.bg};color:${v.light.text}">${swatches('light')}</div><div style="background:${v.dark.bg};color:${v.dark.text}">${swatches('dark')}</div></div></div>
      <div class="card"><h3>Type</h3><div class="type-s">
        <div><code>display ${v.size.h2}</code><span style="font-family:var(--font-display);font-weight:var(--w-display);font-size:${v.size.h2}">Brass Kettle</span></div>
        <div><code>body ${v.size.body}</code><span>Which device should the on-device check use?</span></div>
        <div><code>meta 12px</code><span style="font-size:12px;color:var(--muted)">MOB-1183 · 12m · Work</span></div>
        <div><code>mono 12px</code><span style="font-family:var(--font-mono);font-size:12px">admiral attach brass-kettle</span></div>
        <div><code>radii</code><span>${v.radius.sm} / ${v.radius.md} / ${v.radius.lg} px · row ${v.size.rowH}</span></div>
      </div></div>
      <div class="card"><h3>Ship status</h3><div class="ic">${statusCard}</div></div>
      <div class="card"><h3>Ships</h3><div class="ic">${shipCard}</div></div>
      <div class="card"><h3>Bots</h3><div class="ic">${botCard}</div></div>
      <div class="card"><h3>Harness flags (placeholders on the vendor field)</h3><div class="ic">${flagCard}</div></div>
      <div class="card"><h3>Fleet colors</h3><div class="ic">${fleetCard}</div></div>
      <div class="card"><h3>Phone · Ships</h3><div class="phone">${SHIPS.slice(0,5).map(s=>`<div class="row" style="border-bottom:1px solid var(--line)">${v.rowIcon==='flag'?v.flag(s.harness,18):v.status(s.status)}<span style="display:flex;flex-direction:column;min-width:0;flex:1"><span class="nm">${s.name}</span><span class="meta">${s.what}</span></span>${v.statusLabel?pill(v,s.status):''}</div>`).join('')}
        <div class="bar"><button>${ic('inbox')}Inbox</button><button>${v.bot('admiral',null,18)}Chat</button><button class="on">${v.ship(null,18)}Ships</button><button>${ic('list')}Orders</button></div></div></div>
    </div>`;

  document.getElementById('root').innerHTML = `
    <p class="lead"><b>${cur} · ${v.name}.</b> ${v.blurb}</p>
    ${app}
    <h2 class="sec">Specimen</h2>
    ${spec}`;
}

function ic(n){
  const p = {
    inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
    list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    shield:'<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/>',
    tree:'<path d="M6 3v12M6 9h8a3 3 0 0 0 3-3V3M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>',
    people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  }[n];
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}

/* ---------- events ---------- */
function go(d){ const i = (KEYS.indexOf(cur) + d + KEYS.length) % KEYS.length; cur = KEYS[i]; setURL(); render(); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  const t = e.target; if (t.closest && t.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1);
});
document.addEventListener('click', e => {
  const th = e.target.closest('[data-theme]'); if (th) { theme = th.dataset.theme; setURL(); render(); return; }
  const r = e.target.closest('[data-ship]'); if (r) { sel = r.dataset.ship; render(); return; }
  const tb = e.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; render(); }
});
mq.addEventListener('change', render);
render();
</script>
</body>
</html>
