<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Needs you on the phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.app{--panel:#FFFFFF;--hover:rgba(15,25,40,.045);--sel:rgba(15,25,40,.07);--line:#E5E7EB;--line2:#D6DAE0;--text:#18212C;--text2:#3C4856;--muted:#6B7684;--accent:#0F8C9B;--on-accent:#FFFFFF;--needs:#E5532F;--needs-bg:rgba(229,83,47,.07);--work:#3B6FE0;--home:#D9960F;--shadow:rgba(16,24,40,.06);background:var(--panel);color:var(--text)}
.app[data-theme=dark]{--panel:#111922;--hover:rgba(255,255,255,.04);--sel:rgba(255,255,255,.07);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--text:#E4E9EF;--text2:#B6C0CB;--muted:#7F8B98;--accent:#2BB5C5;--on-accent:#04191D;--needs:#FF7A59;--needs-bg:rgba(255,122,89,.09);--work:#5B8CFF;--home:#FFC23D;--shadow:rgba(0,0,0,.3)}
@media (prefers-color-scheme: dark){.app[data-theme=system]{--panel:#111922;--hover:rgba(255,255,255,.04);--sel:rgba(255,255,255,.07);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--text:#E4E9EF;--text2:#B6C0CB;--muted:#7F8B98;--accent:#2BB5C5;--on-accent:#04191D;--needs:#FF7A59;--needs-bg:rgba(255,122,89,.09);--work:#5B8CFF;--home:#FFC23D;--shadow:rgba(0,0,0,.3)}}
.sub{color:var(--muted)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:500 13.5px Inter,sans-serif;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qc{border:1px solid color-mix(in srgb,var(--needs) 45%,var(--line));border-radius:10px;overflow:hidden}
.qc.sel{box-shadow:0 0 0 2px var(--needs)}
.qc.done{border-color:var(--line)}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);font:500 10.5px Inter,sans-serif;cursor:pointer;padding-top:8px}
.tabbtn.on{color:var(--text)}
.seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--sel)}
.seg button{flex:1;height:30px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:500 13px Inter,sans-serif;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px var(--shadow)}
.irow{display:flex;gap:10px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;color:var(--text);font:14px Inter,sans-serif;cursor:pointer}
.proto{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:#111;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:5}
.proto button{height:26px;min-width:26px;padding:0 9px;border:0;border-radius:999px;background:transparent;color:#cfd3d8;font:500 12px Inter,sans-serif;cursor:pointer}
.proto button.on{background:#fff;color:#111}
</style>
</helmet>
<div class="app" data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; font-size: 14px; overflow: hidden; -webkit-font-smoothing: antialiased;">

  <div class="proto" role="group" aria-label="Prototype variant switcher">
    <sc-for list="{{vbtns}}" as="b" hint-placeholder-count="3"><button class="{{b.cls}}" onClick="{{b.pick}}">{{b.key}}</button></sc-for>
    <button onClick="{{reset}}">Reset</button>
  </div>

  <header style="flex: none; padding: 48px 16px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line);">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-weight: 600; font-size: 17px; flex: 1;">{{title}}</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2);"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--work);"></span>Work<sc-if value="{{homeDot}}" hint-placeholder-val="{{true}}"><span style="display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; color: var(--muted);"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--home);"></span>{{counts.home}}</span></sc-if></span>
    </div>
    <sc-if value="{{isC}}" hint-placeholder-val="{{false}}">
      <div class="seg" role="tablist" aria-label="AdmiralBot view">
        <button class="{{seg.chat}}" onClick="{{toChat}}">Conversation</button>
        <button class="{{seg.needs}}" onClick="{{toNeeds}}">Needs you · {{counts.fleet}}</button>
      </div>
    </sc-if>
  </header>

  <div style="flex: 1; min-height: 0; overflow: auto;">
    <sc-if value="{{showChat}}" hint-placeholder-val="{{true}}">
      <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 14px;">
        <sc-for list="{{stream}}" as="m" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 12px;"><span style="font-weight: 600;">{{m.who}}</span> <span class="sub">{{m.time}}</span></span>
            <span style="line-height: 1.5; color: var(--text2);">{{m.text}}</span>
            <sc-if value="{{m.hasCard}}" hint-placeholder-val="{{false}}">
              <div class="{{m.c.cls}}">
                <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;">
                  <span style="font-size: 12.5px;"><span style="font-weight: 600;">{{m.c.ship}}</span> <span class="sub">{{m.c.kind}}</span></span>
                  <span style="line-height: 1.4;">{{m.c.text}}</span>
                </div>
                <sc-if value="{{m.c.isOpen}}" hint-placeholder-val="{{true}}">
                  <div style="display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 12px;">
                    <sc-for list="{{m.c.opts}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{m.c.isDone}}" hint-placeholder-val="{{false}}">
                  <div class="sub" style="padding: 0 12px 10px; font-size: 12.5px;">You answered: {{m.c.answer}}</div>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{showList}}" hint-placeholder-val="{{false}}">
      <div>
        <sc-for list="{{list}}" as="i" hint-placeholder-count="4">
          <div style="border-bottom: 1px solid var(--line);">
            <div style="display: flex; gap: 10px; padding: 12px 16px 8px;">
              <span style="width: 3px; align-self: stretch; border-radius: 2px; background: {{i.fleetColor}};"></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
                <span style="display: flex; gap: 8px; font-size: 13px;"><span class="ell" style="flex: 1;"><span style="font-weight: 600;">{{i.ship}}</span> <span class="sub">{{i.kind}}</span></span><span class="sub">{{i.age}}</span></span>
                <span style="line-height: 1.4;">{{i.text}}</span>
              </span>
            </div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px 29px;">
              <sc-for list="{{i.opts}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{listEmpty}}" hint-placeholder-val="{{false}}"><div class="sub" style="padding: 48px 16px; text-align: center;">Nothing waiting on you.</div></sc-if>
        <div class="sub" style="padding: 12px 16px; font-size: 12.5px; line-height: 1.5;">{{listNote}}</div>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{showTray}}" hint-placeholder-val="{{false}}">
    <button onClick="{{toNeedsA}}" style="flex: none; margin: 0 12px; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; background: var(--needs-bg); color: var(--text); font: 500 13px Inter, sans-serif; cursor: pointer;"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--needs);"></span><span style="flex: 1; text-align: left;">{{counts.fleet}} waiting on you in this chat</span><span class="sub">Show</span></button>
  </sc-if>
  <sc-if value="{{showComposer}}" hint-placeholder-val="{{true}}">
    <div style="flex: none; padding: 0 12px 10px;">
      <div style="border: 1px solid var(--line2); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; background: var(--panel);">
        <label for="pcmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Message AdmiralBot</label>
        <input id="pcmd" placeholder="Ask AdmiralBot" style="flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: 15px Inter, sans-serif;">
        <button class="btn pri" style="height: 32px;">Send</button>
      </div>
    </div>
  </sc-if>

  <nav aria-label="Tabs" style="flex: none; height: 74px; display: flex; border-top: 1px solid var(--line); padding-bottom: 18px;">
    <button class="{{tabs.bot}}" onClick="{{toChat}}"><svg width="22" height="22" viewBox="0 0 8.5 8.5" aria-hidden="true"><rect x="0.8" y="0.8" width="6.9" height="6.9" rx="1.4" fill="none" stroke="currentColor" stroke-width="0.7"></rect><rect x="2.4" y="3.1" width="1.2" height="1.2" fill="currentColor"></rect><rect x="4.9" y="3.1" width="1.2" height="1.2" fill="currentColor"></rect></svg><span>AdmiralBot<sc-if value="{{botBadge}}" hint-placeholder-val="{{true}}"><span style="color: var(--needs); font-weight: 600;"> {{counts.fleet}}</span></sc-if></span></button>
    <sc-if value="{{isB}}" hint-placeholder-val="{{false}}">
      <button class="{{tabs.inbox}}" onClick="{{toNeeds}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"></path></svg><span>Inbox <span style="color: var(--needs); font-weight: 600;">{{counts.all}}</span></span></button>
    </sc-if>
    <button class="tabbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15h18l-2.4 4.2a2 2 0 0 1-1.7 1H7.1a2 2 0 0 1-1.7-1z"></path><path d="M11 3v12"></path><path d="M11 4.5 17.5 12H11z"></path></svg><span>Ships</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"variant":{"editor":"enum","options":["A","B","C"],"default":"A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: null, done: {}, tab: 'chat' }; }
  renderVals() {
    const vk = this.state.v ?? this.props.variant ?? 'A';
    const isA = vk === 'A', isB = vk === 'B', isC = vk === 'C';
    const done = this.state.done;
    const W = 'var(--work)', H = 'var(--home)';
    const ITEMS = [
      { id: 'r1', ship: 'Pale Lantern', kind: 'requested a review', text: 'PR #812 · Upgrade React Native to 0.81', opts: ['Review', 'Approve'], age: '1h', time: '8:05', fleet: 'work', bot: 'Pale Lantern asked for your review.' },
      { id: 's1', ship: 'Morning Tern', kind: 'finished its turn', text: 'Done. Want me to open the PR?', opts: ['Open the PR', 'Reply'], age: '52m', time: '8:20', fleet: 'work', bot: 'Morning Tern is waiting for the next prompt.' },
      { id: 'f1', ship: 'Brass Kettle', kind: 'sent 3 finding cards', text: 'Race in config watcher · missing test · doc drift', opts: ['Approve all 3', 'Look at each'], age: '18m', time: '8:52', fleet: 'home', bot: '' },
      { id: 'c1', ship: 'AdmiralBot', kind: 'asks', text: 'Relaunch Little Bramble now, or at 10:00?', opts: ['Now', 'At 10:00'], age: '2m', time: '9:12', fleet: 'work', chatQ: true, bot: '' },
      { id: 'q1', ship: 'Saltpaw', kind: 'asks', text: 'Which device should the on-device check use?', opts: ['Pixel 8', 'Emulator', 'Skip'], age: '3m', time: '9:14', fleet: 'work', bot: 'Saltpaw has a question.' }
    ];
    const byId = {}; ITEMS.forEach((it) => { byId[it.id] = it; });
    const answer = (id, label) => this.setState({ done: Object.assign({}, this.state.done, { [id]: label }) });
    const card = (it) => {
      const isDone = !!done[it.id];
      return Object.assign({}, it, { isOpen: !isDone, isDone, answer: done[it.id] || '', cls: isDone ? 'qc done' : 'qc', fleetColor: it.fleet === 'work' ? W : H,
        opts: it.opts.map((label, i) => ({ label, cls: i === 0 ? 'btn pri' : 'btn', pick: () => answer(it.id, label) })) });
    };
    const open = ITEMS.filter((it) => !done[it.id]);
    const workOpen = open.filter((it) => it.fleet === 'work');
    const shipOpen = open.filter((it) => !it.chatQ);
    const counts = { all: shipOpen.length, fleet: isB ? workOpen.filter((it) => !it.chatQ).length : workOpen.length, home: open.filter((it) => it.fleet === 'home').length };
    const bot = (time, text, it) => ({ who: 'AdmiralBot', time, text, hasCard: !!it, c: it ? card(it) : {} });
    const you = { who: 'You', time: '9:12', text: 'Morning. What happened overnight?', hasCard: false, c: {} };
    const stream = isB
      ? [you, bot('9:12', 'Three ships sailed overnight; Little Bramble anchored on a rate limit. Four items wait in your inbox.', byId.c1)]
      : [bot('8:05', byId.r1.bot, byId.r1), bot('8:20', byId.s1.bot, byId.s1), you, bot('9:12', 'Three ships sailed overnight; Little Bramble anchored on a rate limit.', byId.c1), bot('9:14', byId.q1.bot, byId.q1)];
    const tab = this.state.tab;
    const listMode = (isB || isC || isA) && tab === 'needs';
    const list = (isB ? shipOpen : workOpen).map(card);
    const go = (k) => this.setState({ v: k, tab: 'chat' });
    return {
      theme: this.props.theme ?? 'system', isB, isC, counts, stream, list,
      title: isB && tab === 'needs' ? 'Inbox' : 'AdmiralBot',
      homeDot: counts.home > 0 && !isB,
      showChat: !listMode, showList: listMode, listEmpty: list.length === 0,
      listNote: isB ? 'Every fleet, oldest first. AdmiralBot’s own questions stay in its chat.' : (counts.home > 0 ? counts.home + ' more waiting in the Home fleet’s AdmiralBot.' : ''),
      showTray: isA && tab === 'chat' && counts.fleet > 0, showComposer: !(isB && tab === 'needs') && !(isC && tab === 'needs'),
      botBadge: isA || isC,
      seg: { chat: tab === 'chat' ? 'on' : '', needs: tab === 'needs' ? 'on' : '' },
      tabs: { bot: (isB && tab === 'needs') ? 'tabbtn' : 'tabbtn on', inbox: tab === 'needs' ? 'tabbtn on' : 'tabbtn' },
      toChat: () => this.setState({ tab: 'chat' }), toNeeds: () => this.setState({ tab: 'needs' }), toNeedsA: () => this.setState({ tab: 'needs' }),
      vbtns: ['A', 'B', 'C'].map((k) => ({ key: k, cls: k === vk ? 'on' : '', pick: () => go(k) })),
      reset: () => this.setState({ done: {}, tab: 'chat' })
    };
  }
}
</script>
</body>
</html>
