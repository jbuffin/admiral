<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admiral prototype</title>
<!--
  Admiral clickable prototype. Open this file in a browser.
  Scenes: ?scene=harbor (default), ?scene=launch, ?scene=bridge, ?scene=tablet,
  ?scene=inbox, ?scene=inbox-bridge, ?scene=inbox-empty, ?scene=ships, ?scene=orders,
  ?scene=phone-launch (the last three are phone scenes; elsewhere they match harbor)
  Generated from designs/canvas/Main.dc.html by the design handoff; edit the
  .dc.html source, not this file.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C6FD1}a:hover{color:#14304A}
.adm *{box-sizing:border-box}
.adm button{font:inherit;color:inherit;cursor:pointer}
.adm button:focus-visible,.adm input:focus-visible{outline:3px solid #FFC23D;outline-offset:2px}
.press{transition:transform .12s ease,box-shadow .12s ease,background-color .15s ease}
.press:active{transform:translateY(3px);box-shadow:0 1px 0 #14304A !important}
.task{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.task:hover{transform:translateY(-2px)}
.task.sel{background:#FFF0B8 !important;box-shadow:0 0 0 4px #FFC23D,0 3px 0 #14304A !important}
.pier{background-image:repeating-linear-gradient(90deg,transparent 0,transparent 20px,rgba(20,48,74,.18) 20px,rgba(20,48,74,.18) 22px);transition:background-color .15s ease,transform .15s ease,box-shadow .15s ease}
.yard:hover .pier{background-color:#EDBB84 !important}
.yard.ready .pier{background-color:#FFE08A !important;box-shadow:0 0 0 3px #FFC23D,0 3px 0 rgba(20,48,74,.5) !important}
.yard.hot .pier{background-color:#FFC23D !important;transform:scale(1.06)}
.ship-slot{position:absolute;width:100px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.ship-slot.lifted{z-index:5;cursor:grabbing;filter:drop-shadow(0 14px 6px rgba(11,31,51,.35))}
.sail-in{animation:sailin 1.5s cubic-bezier(.2,.9,.25,1.1) .7s both}
.moored{position:absolute;left:-60px;top:3px;width:56px;height:54px;pointer-events:none}
.leave-down{animation:leavedown 1.1s ease-in forwards}
.leave-up{animation:leaveup 1.1s ease-in forwards}
.leave-mid{animation:leavemid 1.1s ease-in forwards}
.arrive{animation:arrive 1s ease-out both}
.gone{opacity:0}
.rowboat{position:absolute;z-index:2;pointer-events:none;animation:drift 6s ease-in-out infinite}
@keyframes leavedown{0%{transform:none;opacity:1}25%{transform:translateX(-14px) rotate(-3deg)}100%{transform:translate(-200px,52px) scale(.8);opacity:0}}
@keyframes leaveup{0%{transform:none;opacity:1}25%{transform:translateX(-14px) rotate(-3deg)}100%{transform:translate(-200px,-52px) scale(.8);opacity:0}}
@keyframes leavemid{0%{transform:none;opacity:1}25%{transform:translateX(-14px) rotate(-3deg)}100%{transform:translate(-200px,0) scale(.8);opacity:0}}
@keyframes arrive{0%{transform:scale(.6) translateY(6px);opacity:0}100%{transform:none;opacity:1}}
.bob{animation:bob 3.2s ease-in-out infinite}
.attn{animation:shake 1.3s ease-in-out infinite}
.flag{transform-box:fill-box;transform-origin:0% 50%}
.wave{animation:wave 1.6s ease-in-out infinite}
.frantic{animation:wave .32s ease-in-out infinite}
.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.ping{animation:ping 1.1s ease-in-out infinite}
.drift{animation:drift 7s ease-in-out infinite}
.fl-item{animation:flyin .55s cubic-bezier(.2,.9,.3,1.15) both}
.fl-item.on{background:#FFC23D !important}
.ship-btn{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;width:100px;cursor:inherit}
.sub-btn{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;width:52px;cursor:inherit}
.opt.on{background:#FFF0B8 !important;box-shadow:0 0 0 3px #FFC23D,0 3px 0 #14304A !important}
.opt.on .dot{background:#14304A}
.ac-row.on{background:#FFF0B8}
.ac-row:hover{background:#FFF6D6}
.ln{white-space:pre-wrap;word-break:break-word}
.ln-sys{color:#7FA6C4}
.ln-agent{color:#F4EEDF}
.ln-tool{color:#6FE3C8}
.ln-ask{color:#14304A;background:#FFC23D;border-radius:6px;padding:6px 10px;margin:4px 0}
.ln-you{color:#FFC23D}
.ln-err{color:#FF9A7A}
.key{transition:background-color .12s ease}
.key:hover{background-color:#2A5579 !important}
.term-in::placeholder{color:#5F7F99}
.caret{animation:blink 1s steps(1) infinite}
.ghost{pointer-events:none;transform:rotate(-5deg)}
.adm input::placeholder{color:#6B7F92}
@keyframes sailin{0%{transform:translateX(420px) scale(.5);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.8deg)}50%{transform:translateY(-5px) rotate(1.8deg)}}
@keyframes shake{0%,46%,100%{transform:rotate(0)}6%{transform:translateX(-4px) rotate(-7deg)}14%{transform:translateX(4px) rotate(7deg)}22%{transform:translateX(-3px) rotate(-4deg)}30%{transform:translateX(3px) rotate(4deg)}38%{transform:translateX(-1px) rotate(-1deg)}}
@keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-9deg) scaleX(.9)}}
@keyframes pop{0%{transform:scale(0) translateY(20px);opacity:0}100%{transform:none;opacity:1}}
@keyframes ping{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,122,89,.7)}50%{transform:scale(1.12);box-shadow:0 0 0 10px rgba(255,122,89,0)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@keyframes flyin{0%{transform:translate(160px,60px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.adm textarea:focus-visible,.adm a:focus-visible{outline:3px solid #FFC23D;outline-offset:2px}
.adm textarea{font:inherit}
.adm textarea::placeholder{color:#6B7F92}
.adm button:disabled{opacity:.45;cursor:default;pointer-events:none}
.ib-drawer{animation:ibdrawer .28s cubic-bezier(.2,.9,.3,1) both}
.ib-sheet{animation:ibsheet .3s cubic-bezier(.2,.9,.3,1) both}
.ib-fold{animation:ibfold .25s ease-out both}
.ib-gone{display:none}
.ib-wrap.ib-slide{overflow:hidden;animation:ibslide .45s ease-in forwards}
@keyframes ibdrawer{0%{transform:translateX(100%);opacity:.4}100%{transform:none;opacity:1}}
@keyframes ibsheet{0%{transform:translateY(100%)}100%{transform:none}}
@keyframes ibfold{0%{transform:scaleY(1.6);opacity:.2}100%{transform:none;opacity:1}}
@keyframes ibslide{0%{transform:none;opacity:1;max-height:90px}55%{transform:translateX(70px);opacity:0;max-height:90px}100%{transform:translateX(70px);opacity:0;max-height:0;margin-top:-6px}}
.ph-bridge{animation:phbridge .3s cubic-bezier(.2,.9,.3,1) both}
.ph-bridge .fl-item{animation:none}
@keyframes phbridge{0%{transform:translateX(100%)}100%{transform:none}}
.ph-tab{min-height:56px}
.ph-strip{scrollbar-width:none}
.ph-strip::-webkit-scrollbar{display:none}
@media (max-height: 499px){.ph-tab{min-height:48px}}
@media (prefers-reduced-motion: reduce){.sail-in,.bob,.attn,.wave,.frantic,.pop,.ping,.drift,.fl-item,.caret,.ib-drawer,.ib-sheet,.ib-fold,.ib-wrap.ib-slide,.ph-bridge{animation:none !important}}
</style>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<template id="dc-template">
<div class="adm" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onCancel}}" style="{{rootStyle}}">

<sc-if value="{{phone}}" hint-placeholder-val="{{ false }}">
<header style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: max(8px, env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left)); background-color: #14304A; color: #F4EEDF; border-bottom: 3px solid #0B1F33">
<svg width="34" height="34" viewBox="0 0 46 46" fill="none" aria-hidden="true" style="flex: 0 0 auto">
<path d="M5 20 Q23 0 41 20 Z" fill="#0B1F33" stroke="#FFC23D" stroke-width="2.5" stroke-linejoin="round"></path>
<circle cx="23" cy="12" r="3" fill="#FFC23D"></circle>
<rect x="9" y="20" width="28" height="22" rx="4" fill="#FFC23D" stroke="#0B1F33" stroke-width="2.5"></rect>
<rect x="15" y="27" width="5" height="5" fill="#14304A"></rect>
<rect x="26" y="27" width="5" height="5" fill="#14304A"></rect>
<rect x="18" y="36" width="10" height="3" fill="#14304A"></rect>
</svg>
<span style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-weight: 800; font-size: 24px; line-height: 1; color: #FFC23D; letter-spacing: -0.01em">Admiral</span>
<span style="flex: 1 1 auto"></span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; background-color: #21486B; font-weight: 600; font-size: 13.5px; color: #F4EEDF; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6FE3C8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 17c2 0 2-1.5 4.5-1.5S9.5 17 12 17s2.5-1.5 4.5-1.5S19 17 21 17"></path><path d="M6 13l6-9 6 9z"></path></svg>{{atSea}} at sea</span>
<span data-slot="settings" style="flex: 0 0 44px; width: 44px; height: 44px"></span>
</header>
</sc-if>

<sc-if value="{{notPhone}}" hint-placeholder-val="{{ true }}">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background-color: #14304A; color: #F4EEDF; border-bottom: 3px solid #0B1F33">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="46" height="46" viewBox="0 0 46 46" fill="none" aria-hidden="true">
<path d="M5 20 Q23 0 41 20 Z" fill="#0B1F33" stroke="#FFC23D" stroke-width="2.5" stroke-linejoin="round"></path>
<circle cx="23" cy="12" r="3" fill="#FFC23D"></circle>
<rect x="9" y="20" width="28" height="22" rx="4" fill="#FFC23D" stroke="#0B1F33" stroke-width="2.5"></rect>
<rect x="15" y="27" width="5" height="5" fill="#14304A"></rect>
<rect x="26" y="27" width="5" height="5" fill="#14304A"></rect>
<rect x="18" y="36" width="10" height="3" fill="#14304A"></rect>
</svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif; font-weight: 800; font-size: 29px; line-height: 1; color: #FFC23D; letter-spacing: -0.01em">Admiral</span>
<span style="font-size: 12.5px; color: #BFD7EA; font-weight: 500">Fleet command for coding agents</span>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" class="press" onClick="{{toggleInbox}}" aria-label="{{inbox.btnAria}}" aria-expanded="{{inboxOpen}}" style="{{inbox.btnStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2.5-8h13L21 13v6H3z"></path><path d="M3 13h5l1.5 3h5L16 13h5"></path></svg>Needs you<sc-if value="{{inbox.hasCount}}" hint-placeholder-val="{{ true }}"><span style="min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px; background-color: #14304A; color: #FFC23D; font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center">{{inbox.count}}</span></sc-if></button>
<span style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background-color: #21486B; font-weight: 600; font-size: 14px; color: #F4EEDF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FE3C8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 17c2 0 2-1.5 4.5-1.5S9.5 17 12 17s2.5-1.5 4.5-1.5S19 17 21 17"></path><path d="M6 13l6-9 6 9z"></path></svg>{{atSea}} at sea</span>
<button type="button" class="press" onClick="{{toggleSound}}" aria-label="{{soundLabel}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #3A6489; background-color: #14304A; color: #F4EEDF; font-weight: 600; font-size: 14px">
<sc-if value="{{sound}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4EEDF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg></sc-if><sc-if value="{{muted}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4EEDF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16 9l5 6M21 9l-5 6"></path></svg></sc-if>{{soundText}}</button>
<span style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background-color: #21486B; font-size: 13px; color: #BFD7EA"><span style="width: 9px; height: 9px; border-radius: 50%; background-color: #4CD38A"></span>2 Commodore profiles</span>
</div>
</header>
</sc-if>

<div style="{{rowStyle}}">

<sc-if value="{{sidebarOpen}}" hint-placeholder-val="{{ true }}">
<aside aria-label="Orders" style="{{ordersStyle}}">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.05; letter-spacing: -0.01em; color: #14304A">Orders</h2>
<span style="font-size: 13px; color: #3E5870">{{ordersHint}}</span>
</div>
<sc-if value="{{notPhone}}" hint-placeholder-val="{{ true }}">
<button type="button" class="press" onClick="{{toggleSidebar}}" aria-label="Collapse orders" style="width: 44px; height: 44px; flex: 0 0 auto; border-radius: 12px; border: 2.5px solid #14304A; background-color: #FFFDF6; box-shadow: 0 3px 0 #14304A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14304A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 6l-6 6 6 6M19 6l-6 6 6 6"></path></svg></button>
</sc-if>
</div>

<div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 12px; border: 2.5px solid #14304A; background-color: #FFFFFF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3E5870" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<label for="adm-filter" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filter orders</label>
<input id="adm-filter" value="{{q}}" onChange="{{onFilter}}" autocomplete="off" placeholder="Filter by title or ID" style="flex: 1 1 auto; min-width: 0; height: 40px; border: 0; background: none; font-family: 'Archivo', sans-serif; font-size: {{filterSize}}; color: #14304A; outline: none">
</div>

<sc-for list="{{panels}}" as="panel" hint-placeholder-count="3">
<section style="border: 2.5px solid #14304A; border-radius: 16px; background-color: #FFFAEE; box-shadow: 0 3px 0 #14304A; overflow: hidden">
<div style="display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 4px">
<button type="button" onClick="{{panel.toggle}}" aria-expanded="{{panel.open}}" style="flex: 1 1 auto; min-width: 0; min-height: 44px; border: 0; background: none; display: flex; align-items: center; gap: 6px; padding: 0 4px; text-align: left">
<svg style="transform: {{panel.chev}}; transition: transform .2s; flex: 0 0 auto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14304A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16.5px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{panel.title}}</span>
</button>
<span style="display: flex; align-items: center">
<sc-for list="{{panel.chips}}" as="chip" hint-placeholder-count="1">
<span title="{{chip.label}}" style="width: 24px; height: 24px; margin-left: -6px; border-radius: 50%; border: 2px solid #FFFAEE; background-color: {{chip.color}}; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{chip.initial}}</span>
</sc-for>
</span>
<span style="min-width: 28px; height: 26px; padding: 0 8px; border-radius: 999px; background-color: #14304A; color: #FFC23D; font-weight: 700; font-size: 12.5px; display: flex; align-items: center; justify-content: center">{{panel.count}}</span>
<sc-if value="{{panel.hasMerge}}" hint-placeholder-val="{{ false }}">
<button type="button" class="press" onClick="{{panel.onMerge}}" aria-label="{{panel.mergeAria}}" title="{{panel.mergeAria}}" style="width: 36px; height: 36px; border-radius: 10px; border: 2px solid #14304A; background-color: #DDF7F3; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #14304A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14304A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v5a5 5 0 0 0 5 5h7M18 4v16M15 17l3 3 3-3"></path></svg></button>
</sc-if>
</div>
<sc-if value="{{panel.open}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 2px 10px 12px">
<sc-for list="{{panel.tasks}}" as="task" hint-placeholder-count="2">
<button type="button" class="{{task.cls}}" onPointerDown="{{task.down}}" onClick="{{task.click}}" aria-label="{{task.aria}}" style="display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 10px 10px 12px; border-radius: 12px; border: 2px solid #14304A; background-color: #FFFFFF; box-shadow: 0 2px 0 #14304A; min-height: 64px">
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px">
<span style="width: 16px; height: 16px; border-radius: 50%; background-color: {{task.srcColor}}; color: #FFFFFF; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">{{task.srcInitial}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #3E5870; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{task.id}}</span>
<sc-if value="{{task.hot}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10.5px; font-weight: 700; color: #14304A; background-color: #FF9A7A; border-radius: 5px; padding: 1px 5px; flex: 0 0 auto">High</span></sc-if>
</span>
<span style="font-weight: 600; font-size: 14.5px; line-height: 1.3; color: #14304A">{{task.title}}</span>
</span>
<sc-if value="{{notPhone}}" hint-placeholder-val="{{ true }}"><svg width="12" height="20" viewBox="0 0 12 20" fill="#9AAFC0" aria-hidden="true" style="flex: 0 0 auto"><circle cx="3" cy="4" r="1.7"></circle><circle cx="9" cy="4" r="1.7"></circle><circle cx="3" cy="10" r="1.7"></circle><circle cx="9" cy="10" r="1.7"></circle><circle cx="3" cy="16" r="1.7"></circle><circle cx="9" cy="16" r="1.7"></circle></svg></sc-if>
<sc-if value="{{phone}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AAFC0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M8 5l8 7-8 7"></path></svg></sc-if>
</button>
</sc-for>
<sc-if value="{{panel.empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 8px; font-size: 13.5px; color: #3E5870; text-align: center">{{panel.emptyText}}</p>
</sc-if>
</div>
</sc-if>
</section>
</sc-for>

<button type="button" class="press" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 14px; border: 2.5px dashed #14304A; background-color: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 15px; color: #14304A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14304A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add source plugin</button>
</aside>
</sc-if>

<sc-if value="{{sidebarClosed}}" hint-placeholder-val="{{ false }}">
<aside aria-label="Orders, collapsed" style="flex: 0 0 76px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; background-color: #FFF1CF; border-right: 3px solid #14304A">
<button type="button" class="press" onClick="{{toggleSidebar}}" aria-label="Expand orders" style="width: 48px; height: 48px; border-radius: 12px; border: 2.5px solid #14304A; background-color: #FFFDF6; box-shadow: 0 3px 0 #14304A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14304A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 6l6 6-6 6M5 6l6 6-6 6"></path></svg></button>
<sc-for list="{{panels}}" as="panel" hint-placeholder-count="3">

<sc-if value="{{notPhone}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; background-color: #FFF6E3; border-bottom: 3px solid #14304A">
<svg width="40" height="26" viewBox="0 0 40 26" aria-hidden="true"><path d="M2 2 L38 2 L30 13 L38 24 L2 24 Z" fill="{{bridge.ship.flag}}" stroke="#14304A" stroke-width="2.5" stroke-linejoin="round"></path><text x="15" y="17.5" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="12" fill="{{bridge.ship.flagInk}}">{{bridge.ship.mono}}</text></svg>
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1">{{bridge.ship.name}} <span style="font-weight: 500; color: #3E5870">› {{bridge.focusName}}</span></span>
<span style="font-size: 13px; color: #3E5870">{{bridge.ship.harness}} · {{bridge.ship.fleetName}} · {{bridge.ship.skill}} · {{bridge.ship.task.id}} {{bridge.ship.task.title}}</span>
</div>
<span style="{{bridge.statusStyle}}">{{bridge.statusText}}</span>
<button type="button" class="press" onClick="{{closeBridge}}" aria-label="Close terminal and return to open water" style="width: 44px; height: 44px; border-radius: 12px; border: 2.5px solid #14304A; background-color: #FFFDF6; box-shadow: 0 3px 0 #14304A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14304A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-if>
<div style="flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px 18px 8px; display: flex; flex-direction: column; gap: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13.5px; line-height: 1.55">
<sc-for list="{{bridge.lines}}" as="line" hint-placeholder-count="6">
<div class="{{line.cls}}">{{line.t}}</div>
</sc-for>
<sc-if value="{{bridge.live}}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{send}}" style="display: flex; align-items: center; gap: 8px; margin-top: 4px">
<label for="adm-cmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Input to {{bridge.focusName}}</label>
<span aria-hidden="true" style="color: #FFC23D; font-weight: 600">❯</span>
<input id="adm-cmd" class="term-in" value="{{draft}}" onChange="{{onDraft}}" autocomplete="off" spellcheck="false" placeholder="type here and press Enter" style="flex: 1 1 auto; min-width: 0; height: 32px; padding: 0; border: 0; background: none; color: #FFC23D; font-family: 'JetBrains Mono', monospace; font-size: {{termInSize}}; outline: none; caret-color: #FFC23D">
</form>
</sc-if>
</div>
<div style="{{bridge.keysStyle}}">
<sc-if value="{{bridge.anchored}}" hint-placeholder-val="{{ false }}">
<button type="button" class="press" onClick="{{dismiss}}" style="height: {{keyH}}; padding: 0 14px; border-radius: 10px; border: 2.5px solid #0B1F33; background-color: #FFF6E3; color: #14304A; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 14px; box-shadow: 0 3px 0 #0B1F33">Dismiss</button>
<span style="flex: 1 1 auto"></span>
<span style="font-size: 12px; color: #9DB8CF">The harness exited. This is its last screen.</span>
</sc-if>
<sc-if value="{{bridge.live}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="6">
<button type="button" class="key" onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: {{keyH}}; min-width: 44px; padding: 0 10px; border-radius: 10px; border: 2px solid #3A6489; background-color: #1B3D5C; color: #F4EEDF; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 600">{{k.label}}</button>
</sc-for>
<span style="flex: 1 1 auto"></span>
<sc-if value="{{notPhone}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 12px; color: #9DB8CF">Keys go straight to the session</span>
</sc-if>
</sc-if>
</div>
</section>
</div>
</sc-if>
</main>

<sc-if value="{{inboxShown}}" hint-placeholder-val="{{ true }}">
<aside aria-label="Needs you inbox" role="{{inbox.role}}" aria-modal="{{inbox.modal}}" tabindex="-1" class="{{inbox.cls}}" style="{{inbox.style}}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0">
<div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; background-color: #FFF6E3; border-bottom: 3px solid #14304A">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.05; letter-spacing: -0.01em; color: #14304A">Needs you</h2>
<span style="flex: 1 1 auto; font-size: 13px; color: #3E5870">{{inbox.headCount}}</span>
<sc-if value="{{inbox.showClose}}" hint-placeholder-val="{{ true }}">
<button type="button" class="press" onClick="{{closeInbox}}" aria-label="Close the inbox" style="width: 44px; height: 44px; flex: 0 0 auto; border-radius: 12px; border: 2.5px solid #14304A; background-color: #FFFDF6; box-shadow: 0 3px 0 #14304A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14304A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</sc-if>
</div>

<div data-ib-list="1" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{inbox.cards}}" as="c" hint-placeholder-count="3">
<div class="{{c.wrapCls}}" data-ib="{{c.id}}">

<sc-if value="{{c.done}}" hint-placeholder-val="{{ false }}">
<div class="ib-fold" role="status" style="display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 14px; border-radius: 16px; border: 2.5px solid #14304A; background-color: #DDF7F3; box-shadow: 0 3px 0 #14304A">
<span style="width: 26px; height: 26px; flex: 0 0 auto; border-radius: 50%; background-color: #9BE08A; border: 2.5px solid #14304A; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#14304A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="flex: 1 1 auto; min-width: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15.5px; line-height: 1.25">{{c.doneText}}</span>
<span style="flex: 0 0 auto; font-size: 12.5px; color: #3E5870">{{c.shipName}}</span>
</div>
</sc-if>

<sc-if value="{{c.open}}" hint-placeholder-val="{{ true }}">
<article style="display: flex; flex-direction: column; gap: 14px; padding: 14px; border-radius: 16px; border: 2.5px solid #14304A; background-color: #FFFAEE; box-shadow: 0 3px 0 #14304A">

<div style="display: flex; align-items: center; gap: 10px">
<svg width="40" height="28" viewBox="0 0 40 28" aria-hidden="true" style="flex: 0 0 auto"><path d="M2 3 L38 3 L30 14 L38 25 L2 25 Z" fill="{{c.flag}}" stroke="#14304A" stroke-width="2.6" stroke-linejoin="round"></path><text x="15" y="18.5" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="12" fill="{{c.flagInk}}">{{c.mono}}</text></svg>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px; line-height: 1.15">{{c.shipName}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #3E5870"><span aria-hidden="true" style="width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background-color: {{c.fleetColor}}; border: 1.5px solid #14304A"></span>{{c.fleetName}} · {{c.harness}}</span>
</div>
<span style="flex: 0 0 auto; font-size: 12.5px; font-weight: 600; color: #3E5870; text-align: right">{{c.age}}</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="align-self: flex-start; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; border: 1.5px solid #14304A; background-color: {{c.kindBg}}">{{c.kindLabel}}</span>
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.2; overflow-wrap: anywhere">{{c.title}}</h3>
<sc-if value="{{c.hasOrder}}" hint-placeholder-val="{{ false }}"><a href="{{c.orderUrl}}" target="_blank" rel="noopener" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; font-size: 13.5px; font-weight: 600">Open the order ↗</a></sc-if>
</div>

<sc-if value="{{c.isQuestion}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{c.qs}}" as="q" hint-placeholder-count="2">
<div role="group" aria-label="{{q.aria}}" style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 2px dashed #8AA2B6">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #3E5870">{{q.counter}}</span>
<p style="margin: 0; font-size: 16px; font-weight: 500; line-height: 1.45; overflow-wrap: anywhere">{{q.text}}</p>
<sc-for list="{{q.opts}}" as="o" hint-placeholder-count="3">
<button type="button" role="{{o.role}}" aria-checked="{{o.on}}" class="{{o.cls}}" onClick="{{o.pick}}" style="display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 56px; padding: 12px 14px; border-radius: 14px; border: 2.5px solid #14304A; background-color: #FFFDF6; box-shadow: 0 3px 0 #14304A; text-align: left">
<span class="dot" style="width: 20px; height: 20px; flex: 0 0 auto; margin-top: 2px; border-radius: {{o.dotRadius}}; border: 3px solid #14304A; background-color: #FFFDF6; box-shadow: inset 0 0 0 3px #FFFDF6"></span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16.5px; line-height: 1.2">{{o.label}}</span><sc-if value="{{o.rec}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11.5px; font-weight: 700; background-color: #14304A; color: #FFC23D; border-radius: 8px; padding: 3px 8px">Recommended</span></sc-if></span>
<sc-if value="{{o.hasDesc}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13.5px; color: #3E5870; line-height: 1.35">{{o.desc}}</span></sc-if>
</span>
</button>
</sc-for>
<button type="button" role="{{q.other.role}}" aria-checked="{{q.other.on}}" class="{{q.other.cls}}" onClick="{{q.other.pick}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 14px; border-radius: 14px; border: 2.5px solid #14304A; background-color: #FFFDF6; box-shadow: 0 3px 0 #14304A; text-align: left">
<span class="dot" style="width: 20px; height: 20px; flex: 0 0 auto; border-radius: {{q.other.dotRadius}}; border: 3px solid #14304A; background-color: #FFFDF6; box-shadow: inset 0 0 0 3px #FFFDF6"></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16.5px; line-height: 1.2">Other</span><span style="font-size: 13.5px; color: #3E5870">Write your own answer</span></span>
</button>
<sc-if value="{{q.other.on}}" hint-placeholder-val="{{ false }}">
<input type="text" value="{{q.other.text}}" onChange="{{q.other.onText}}" aria-label="{{q.other.aria}}" autocomplete="off" placeholder="Your answer" style="width: 100%; height: 48px; padding: 0 12px; border-radius: 12px; border: 2.5px solid #14304A; background-color: #FFFFFF; font-family: 'Archivo', sans-serif; font-size: 16px; color: #14304A">
</sc-if>
<textarea value="{{q.note}}" onChange="{{q.onNote}}" aria-label="{{q.noteAria}}" rows="2" placeholder="Add a note (optional)" style="display: block; width: 100%; min-height: 64px; padding: 10px 12px; border-radius: 12px; border: 2.5px solid #14304A; background-color: #FFFFFF; font-size: 16px; line-height: 1.4; color: #14304A; resize: vertical"></textarea>
</div>
</sc-for>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" class="press" disabled="{{c.sendOff}}" onClick="{{c.send}}" style="min-height: 48px; padding: 0 22px; border-radius: 14px; border: 2.5px solid #14304A; background-color: #FFC23D; box-shadow: 0 4px 0 #14304A; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px">Send answers</button>
<span style="font-size: 13px; color: #3E5870">{{c.progress}}</span>
</div>
</sc-if>

<sc-if value="{{c.isReview}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; border-radius: 12px; background-color: #FFFDF6; border: 2px dashed #8AA2B6">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #3E5870">Summary</span>
<p style="margin: 0; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere">{{c.rv.summary}}</p>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: #3E5870">
<a href="{{c.rv.prUrl}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 44px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600">{{c.rv.prLabel}} ↗</a>
<span>Pending review #{{c.rv.reviewId}}, not yet submitted</span>
</div>

<sc-if value="{{c.rv.modeNone}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" class="press" onClick="{{c.rv.openSubmit}}" style="flex: 1 1 110px; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2.5px solid #14304A; background-color: #FFC23D; box-shadow: 0 4px 0 #14304A; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px">Submit</button>
<a class="press" href="{{c.rv.editHref}}" target="_blank" rel="noopener" style="flex: 1 1 110px; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2.5px solid #14304A; background-color: #FFFDF6; box-shadow: 0 3px 0 #14304A; color: #14304A; text-decoration: none; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center">Edit ↗</a>
<button type="button" class="press" onClick="{{c.rv.askDiscard}}" style="flex: 1 1 110px; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2.5px solid #14304A; background-color: #FFFDF6; box-shadow: 0 3px 0 #14304A; color: #C2412A; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">Discard</button>
</div>
</sc-if>

<sc-if value="{{c.rv.modeChoose}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Submit the review as" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px">Submit the review as</span>
<sc-for list="{{c.rv.events}}" as="ev" hint-placeholder-count="3">
<button type="button" class="press" onClick="{{ev.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; min-height: 56px; padding: 10px 14px; border-radius: 14px; border: 2.5px solid #14304A; background-color: {{ev.bg}}; box-shadow: 0 3px 0 #14304A; text-align: left"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14.5px">{{ev.id}}</span><span style="font-size: 13px; color: #3E5870">{{ev.desc}}</span></button>
</sc-for>
<button type="button" class="press" onClick="{{c.rv.cancel}}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 2.5px solid #14304A; background-color: #FFFDF6; box-shadow: 0 3px 0 #14304A; font-weight: 600; font-size: 15px">Cancel</button>
</div>
</sc-if>

<sc-if value="{{c.rv.modeConfirm}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Confirm the review" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; border: 2.5px solid #14304A; background-color: #FFF0B8">
<p style="margin: 0; font-size: 15px; line-height: 1.4">Submit this review as <b style="font-family: 'JetBrains Mono', monospace">{{c.rv.event}}</b>? It is posted to the PR as you.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" class="press" onClick="{{c.rv.confirm}}" style="flex: 1 1 140px; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2.5px solid #14304A; background-color: #FFC23D; box-shadow: 0 4px 0 #14304A; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">Submit {{c.rv.event}}</button>
<button type="button" class="press" onClick="{{c.rv.change}}" style="flex: 1 1 90px; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2.5px solid #14304A; background-color: #FFFDF6; box-shadow: 0 3px 0 #14304A; font-weight: 600; font-size: 15px">Change</button>
</div>
</div>
</sc-if>

<sc-if value="{{c.rv.modeDiscard}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Confirm discarding the review" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; border: 2.5px solid #C2412A; background-color: #FFD9CC">
<p style="margin: 0; font-size: 15px; line-height: 1.4">Discard this pending review? The draft comments are deleted from GitHub.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" class="press" onClick="{{c.rv.discard}}" style="flex: 1 1 140px; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2.5px solid #14304A; background-color: #FF9A7A; box-shadow: 0 4px 0 #14304A; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">Discard review</button>
<button type="button" class="press" onClick="{{c.rv.cancel}}" style="flex: 1 1 90px; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2.5px solid #14304A; background-color: #FFFDF6; box-shadow: 0 3px 0 #14304A; font-weight: 600; font-size: 15px">Keep it</button>
</div>
</div>
</sc-if>
</sc-if>

<sc-if value="{{c.isFindings}}" hint-placeholder-val="{{ false }}">
<a href="{{c.fd.prUrl}}" target="_blank" rel="noopener" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600">{{c.fd.prLabel}} ↗</a>
<sc-for list="{{c.fd.cards}}" as="f" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; border: 2px solid #14304A; background-color: #FFFDF6; box-shadow: 0 2px 0 #14304A">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; border: 1.5px solid #14304A; background-color: {{f.verdictBg}}">{{f.verdict}}</span>
<span style="flex: 1 1 auto; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #3E5870; overflow-wrap: anywhere">{{f.source}}</span>
</div>
<blockquote style="margin: 0; padding: 2px 0 2px 10px; border-left: 4px solid #FFC23D; font-size: 14.5px; line-height: 1.45; overflow-wrap: anywhere">{{f.quote}}</blockquote>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #3E5870; overflow-wrap: anywhere"><b style="color: #14304A">Why:</b> {{f.reason}}</p>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #3E5870">{{f.proposalLabel}}</span>
<sc-if value="{{f.editing}}" hint-placeholder-val="{{ false }}">
<textarea value="{{f.text}}" onChange="{{f.onText}}" aria-label="{{f.textAria}}" rows="4" style="display: block; width: 100%; min-height: 96px; padding: 10px 12px; border-radius: 10px; border: 2.5px solid #14304A; background-color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 16px; line-height: 1.4; color: #14304A; resize: vertical"></textarea>
</sc-if>
<sc-if value="{{f.shown}}" hint-placeholder-val="{{ true }}">
<pre style="margin: 0; padding: 10px 12px; border-radius: 10px; background-color: #0E2235; color: #F4EEDF; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere">{{f.text}}</pre>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #3E5870">Evidence</span>
<sc-for list="{{f.evidence}}" as="ev" hint-placeholder-count="2"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.5; color: #3E5870; overflow-wrap: anywhere">{{ev.t}}</span></sc-for>
</div>
<div role="group" aria-label="{{f.groupAria}}" style="display: flex; gap: 8px">
<button type="button" class="press" aria-pressed="{{f.isApprove}}" onClick="{{f.approve}}" style="flex: 1 1 0; min-height: 48px; border-radius: 12px; border: 2.5px solid #14304A; background-color: {{f.approveBg}}; box-shadow: {{f.approveShadow}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px">Approve</button>
<button type="button" class="press" aria-pressed="{{f.isEdit}}" onClick="{{f.edit}}" style="flex: 1 1 0; min-height: 48px; border-radius: 12px; border: 2.5px solid #14304A; background-color: {{f.editBg}}; box-shadow: {{f.editShadow}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px">Edit</button>

  chirp() {

      this.ac = this.ac || new C();
      const ac = this.ac;
      const t = ac.currentTime;

        const g = ac.createGain();

        o.frequency.value = nd[0];

        g.gain.exponentialRampToValueAtTime(0.0001, t + nd[1] + 0.2);

  // ---- Needs You inbox (prototype for #116) ----
  // Items follow the contract in #112, which has no ship field: the ship is
  // the inbox directory a file sits in. The sample items carry `ship` beside
  // the contract fields only to stand in for that directory.
  // Three size classes, decided here and nowhere else.
  // phone:  (max-width: 760px), as web/src/styles.css, or a short window (an iPhone in
  //         landscape), so rotating a phone never brings back open water. Tab bar, lists, bridge on top.
  // wide:   1024px and up, in landscape, unless phone matches. The inbox is a drawer. Desktop and iPad landscape.
  // middle: everything else: iPad portrait and desktop windows from 761px to 1023px. The harbor as today;
  //         the inbox is a full-screen sheet.
  phoneQuery() { return '(max-width: 760px), (max-height: 499px)'; }
  wideQuery() { return '(min-width: 1024px) and (orientation: landscape)'; }
  sizeNow() {
    try {
      if (window.matchMedia(this.phoneQuery()).matches) return 'phone';
      return window.matchMedia(this.wideQuery()).matches ? 'wide' : 'middle';
    } catch (err) { return 'wide'; }
  }

  componentDidMount() {
    try {

      this.onMq = () => { const size = this.sizeNow(); this.put({ size, wide: size === 'wide' }); };
      this.mqs.forEach((mq) => { if (mq.addEventListener) mq.addEventListener('change', this.onMq); else mq.addListener(this.onMq); });
      this.onMq();
    } catch (err) {}
    this.ibFocus();
    this.clock = setInterval(() => this.put({ tick: Date.now() }), 30000);
  }
  componentWillUnmount() {
    try { (this.mqs || []).forEach((mq) => { if (mq.removeEventListener) mq.removeEventListener('change', this.onMq); else mq.removeListener(this.onMq); }); } catch (err) {}

  }

  agoText(ms) {

  ibList(st, withGone) {
